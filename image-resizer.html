<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer</title>
</head>
<body style="background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
  <div style="font-family: sans-serif; padding: 25px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
    <h2 style="margin-top:0; font-size: 1.25rem; margin-bottom: 15px;">Image Resizer</h2>
    <input type="file" id="upload" accept="image/*" style="margin-bottom: 15px; color: #fff;"><br>
    
    <label style="font-size: 0.9rem; cursor: pointer;"><input type="checkbox" id="lockRatio" checked> Lock Aspect Ratio</label><br><br>
    
    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
      <input type="number" id="width" placeholder="Width (px)" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff;"> x 
      <input type="number" id="height" placeholder="Height (px)" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff;">
    </div>
    
    <button onclick="downloadImage()" style="width: 100%; padding: 10px; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 6px; cursor: pointer;">Download Resized Image</button>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
  let originalRatio = 1;
  const upload = document.getElementById('upload');
  const wInput = document.getElementById('width');
  const hInput = document.getElementById('height');
  const lock = document.getElementById('lockRatio');

  upload.addEventListener('change', function(e) {
      const reader = new FileReader();
      reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
              wInput.value = img.width;
              hInput.value = img.height;
              originalRatio = img.height / img.width;
          };
          img.src = event.target.result;
      };
      reader.readAsDataURL(e.target.files[0]);
  });

  hInput.addEventListener('input', () => {
      if (lock.checked) wInput.value = Math.round(hInput.value / originalRatio);
  });

  wInput.addEventListener('input', () => {
      if (lock.checked) hInput.value = Math.round(wInput.value * originalRatio);
  });

  function downloadImage() {
      const file = upload.files[0];
      if (!file) return alert("Select an image first!");

      const reader = new FileReader();
      reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
              const canvas = document.getElementById('canvas');
              const ctx = canvas.getContext('2d');
              
              canvas.width = parseInt(wInput.value);
              canvas.height = parseInt(hInput.value);
              
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              
              const link = document.createElement('a');
              link.download = 'resized-image.png';
              link.href = canvas.toDataURL('image/png');
              link.click();
          };
          img.src = e.target.result;
      };
      reader.readAsDataURL(file);
  }
  </script>
</body>
</html>
